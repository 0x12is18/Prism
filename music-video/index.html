    <rect x="36" y="58" width="92" height="102" rx="6" transform="rotate(-9 82 109)"/>
    <rect x="94" y="80" width="92" height="102" rx="6" transform="rotate(7 140 131)"/>
    <rect x="66" y="102" width="92" height="102" rx="6" transform="rotate(-2 112 153)"/>`
};

/* ===================== Scene rendering ===================== */
const SVG_NS = "http://www.w3.org/2000/svg";
const stage = document.getElementById("stage");
const sceneCache = {}; // "sceneId|accent" -> <svg> element (in DOM, hidden)

function buildScene(sceneId, accent) {
  const key = sceneId + "|" + accent;
  if (sceneCache[key]) return sceneCache[key];

  const svg = document.createElementNS(SVG_NS, "svg");
  svg.classList.add("scene");
  svg.setAttribute("viewBox", "0 0 1600 900");
  svg.setAttribute("preserveAspectRatio", "xMidYMid slice");

  const uid = "g" + Math.random().toString(36).slice(2, 9);

  svg.innerHTML = `
    <defs>
      <linearGradient id="${uid}-sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#170a2e"/>
        <stop offset="55%" stop-color="#2a0f4d"/>
        <stop offset="100%" stop-color="#050110"/>
      </linearGradient>
      <radialGradient id="${uid}-sun" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="${accent}" stop-opacity="0.95"/>
        <stop offset="100%" stop-color="${accent}" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="${uid}-ground" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${accent}" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="${accent}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <rect width="1600" height="900" fill="url(#${uid}-sky)"/>
    <circle cx="800" cy="560" r="420" fill="url(#${uid}-sun)"/>
    <circle cx="800" cy="560" r="230" fill="none" stroke="${accent}" stroke-width="4" opacity="0.55"/>
    ${starsMarkup()}
    <rect x="0" y="560" width="1600" height="340" fill="url(#${uid}-ground)"/>
    ${gridMarkup(accent)}
    <g transform="translate(800 470) scale(2.35)" fill="none" stroke="${accent}"
       stroke-width="9" stroke-linecap="round" stroke-linejoin="round"
       style="filter: drop-shadow(0 0 18px ${accent})">
      <g transform="translate(-120 -120)">${ICONS[sceneId] || ""}</g>
    </g>
  `;
  stage.insertBefore(svg, document.getElementById("captionWrap"));
  sceneCache[key] = svg;
  return svg;
}

function starsMarkup() {
  let s = "";
  let seed = 42;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return (seed % 1000) / 1000; };
  for (let i = 0; i < 60; i++) {
    const x = rnd() * 1600, y = rnd() * 420, r = 1 + rnd() * 1.6, o = 0.25 + rnd() * 0.55;
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="#fff" opacity="${o.toFixed(2)}"/>`;
  }
  return s;
}

function gridMarkup(accent) {
  let s = "";
  const horizon = 560, vpX = 800, bottom = 900;
  for (let i = -14; i <= 14; i++) {
    const xTop = vpX + i * 40;
    const xBot = vpX + i * 240;
    s += `<line x1="${xTop}" y1="${horizon}" x2="${xBot}" y2="${bottom}" stroke="${accent}" stroke-width="2" opacity="0.4"/>`;
  }
  for (let j = 0; j < 7; j++) {
    const t = j / 6;
    const y = horizon + (bottom - horizon) * (t * t);
    s += `<line x1="0" y1="${y.toFixed(1)}" x2="1600" y2="${y.toFixed(1)}" stroke="${accent}" stroke-width="2" opacity="${(0.5 - t * 0.35).toFixed(2)}"/>`;
  }
  return s;
}

let activeScene = null;
function showScene(sceneId, accent) {
  const svg = buildScene(sceneId, accent);
  if (svg === activeScene) return;
  if (activeScene) activeScene.classList.remove("active");
  svg.classList.add("active");
  activeScene = svg;
}

/* ===================== Player logic ===================== */
const audio = document.getElementById("audio");
const caption = document.getElementById("caption");
const sectionBadge = document.getElementById("section-badge");
const playBtn = document.getElementById("playBtn");
const splash = document.getElementById("splash");
const playPause = document.getElementById("playPause");
const seek = document.getElementById("seek");
const timeEl = document.getElementById("time");
const lyricsToggle = document.getElementById("lyricsToggle");
const lyricsPanel = document.getElementById("lyricsPanel");

function fmt(t) {
  t = Math.max(0, t | 0);
  const m = Math.floor(t / 60), s = t % 60;
  return m + ":" + String(s).padStart(2, "0");
}

function findLineIndex(t) {
  let lo = 0, hi = LYRICS.length - 1, ans = 0;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (LYRICS[mid].start <= t) { ans = mid; lo = mid + 1; }
    else hi = mid - 1;
  }
  return ans;
}

let lastIdx = -1;
function updateForTime(t) {
  const idx = findLineIndex(t);
  const line = LYRICS[idx];
  if (idx !== lastIdx) {
    lastIdx = idx;
    showScene(line.scene, line.accent);
    caption.style.color = line.accent;
    caption.textContent = line.text;
    sectionBadge.textContent = line.section;
    caption.classList.remove("show");
    void caption.offsetWidth;
    caption.classList.add("show");
    highlightPanelLine(idx);
  }
  if (!seekDragging) {
    seek.value = t;
    timeEl.textContent = fmt(t) + " / " + fmt(audio.duration || LYRICS[LYRICS.length - 1].end);
  }
}

let raf = null;
function tick() {
  updateForTime(audio.currentTime);
  raf = requestAnimationFrame(tick);
}

function start() {
  splash.classList.add("hidden");
  audio.play().then(() => {
    playPause.textContent = "⏸";
    if (!raf) raf = requestAnimationFrame(tick);
  }).catch(() => {});
}
playBtn.addEventListener("click", start);

playPause.addEventListener("click", () => {
  if (audio.paused) {
    audio.play();
    playPause.textContent = "⏸";
  } else {
    audio.pause();
    playPause.textContent = "▶";
  }
});

audio.addEventListener("loadedmetadata", () => {
  seek.max = audio.duration || LYRICS[LYRICS.length - 1].end;
});
audio.addEventListener("ended", () => {
  playPause.textContent = "▶";
  cancelAnimationFrame(raf); raf = null;
});
audio.addEventListener("pause", () => {
  playPause.textContent = "▶";
});
audio.addEventListener("play", () => {
  playPause.textContent = "⏸";
  if (!raf) raf = requestAnimationFrame(tick);
});

let seekDragging = false;
seek.addEventListener("input", () => {
  seekDragging = true;
  timeEl.textContent = fmt(+seek.value) + " / " + fmt(audio.duration || LYRICS[LYRICS.length - 1].end);
});
seek.addEventListener("change", () => {
  audio.currentTime = +seek.value;
  seekDragging = false;
});

/* ---------- Full lyrics panel ---------- */
const panelLineEls = [];
(function buildPanel() {
  let lastSection = null;
  LYRICS.forEach((l, i) => {
    if (l.section !== lastSection) {
      lastSection = l.section;
      const head = document.createElement("div");
      head.className = "section-head";
      head.textContent = l.section;
      lyricsPanel.appendChild(head);
    }
    const div = document.createElement("div");
    div.className = "line";
    div.textContent = l.text;
    div.addEventListener("click", () => {
      audio.currentTime = l.start;
      if (audio.paused) start();
      lyricsPanel.classList.remove("open");
    });
    lyricsPanel.appendChild(div);
    panelLineEls.push(div);
  });
})();
function highlightPanelLine(idx) {
  const prev = lyricsPanel.querySelector(".line.current");
  if (prev) prev.classList.remove("current");
  const el = panelLineEls[idx];
  if (el) {
    el.classList.add("current");
    if (lyricsPanel.classList.contains("open")) {
      el.scrollIntoView({ block: "center", behavior: "smooth" });
    }
  }
}
lyricsToggle.addEventListener("click", () => {
  lyricsPanel.classList.toggle("open");
});

/* Prime first scene so it's ready before playback starts */
updateForTime(0);
</script>
